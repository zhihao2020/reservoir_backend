[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reservoir-backend"
version = "0.1.0"
description = "Lightweight reservoir backend prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["reservoir_backend*"]
exclude = ["tests*", "benchmarks*", "examples*", "scripts*", "harness*", "docs*", "specs*", "config*", "results*", "accuracy_reports*", "validation_reports*", "profiling_reports*", "references*", "requirements*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
