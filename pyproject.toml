[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reservoir-backend"
dynamic = ["version"]
description = "Laboratory 3D shale-oil reconstruction: mesh, pressure, saturation, k/phi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "scipy",
  "PyYAML",
  "pyamg",
]

[project.optional-dependencies]
dev = ["pytest"]
pack = ["nuitka", "ordered-set", "zstandard"]

[project.scripts]
reservoir = "src.cli.main:main"

[tool.setuptools.dynamic]
version = {attr = "src.version.__version__"}

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
