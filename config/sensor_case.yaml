# Demo: injectors/producers + observation probes (测点, no fluid rate)

bounds:
  xmin: 0.0
  xmax: 100.0
  ymin: 0.0
  ymax: 80.0
  zmin: 0.0
  zmax: 30.0

grid:
  dx: 10.0
  dy: 10.0
  dz: 10.0

wells:
  - name: INJ
    x: 10.0
    y: 40.0
    z: 15.0
    role: injector
  - name: PROD
    x: 90.0
    y: 40.0
    z: 15.0
    role: producer

# Measurement-only probes (known p and S; do NOT inject/produce)
observers:
  - name: OBS1
    x: 40.0
    y: 40.0
    z: 15.0
  - name: OBS2
    x: 60.0
    y: 50.0
    z: 15.0

sensors:
  time: 0.0
  well_pressure:
    INJ: 1.2e7
    PROD: 1.0e7
  well_saturation:
    INJ: [0.80, 0.20, 0.0]
    PROD: [0.25, 0.75, 0.0]
  # optional rates (m3/s): +inject -produce; observers must not appear here
  well_rate:
    INJ: 2.0e-5
    PROD: -2.0e-5
  observer_pressure:
    OBS1: 1.12e7
    OBS2: 1.05e7
  observer_saturation:
    OBS1: [0.45, 0.55, 0.0]
    OBS2: [0.35, 0.65, 0.0]
  boundary_pressure:
    left: 1.2e7
    right: 1.0e7

priors:
  permeability_m2: 1.0e-13
  porosity: 0.2
  viscosity_pa_s: 1.0e-3
