# Point-first design:
#   - injectors/producers may have p, S, and rates
#   - each probe measures ONLY pressure OR ONLY saturation

bounds:
  xmin: 0.0
  xmax: 100.0
  ymin: 0.0
  ymax: 80.0
  zmin: 0.0
  zmax: 30.0

grid:
  dx: 10.0
  dy: 10.0
  dz: 10.0

wells:
  - name: INJ
    x: 10.0
    y: 40.0
    z: 15.0
    role: injector
  - name: PROD
    x: 90.0
    y: 40.0
    z: 15.0
    role: producer

# A-type: pressure-only probes  |  B-type: saturation-only probes
observers:
  - name: OBS_P1
    x: 40.0
    y: 40.0
    z: 15.0
    measure: pressure          # → role observer_p
  - name: OBS_S1
    x: 60.0
    y: 50.0
    z: 15.0
    measure: saturation        # → role observer_s

sensors:
  time: 0.0
  well_pressure:
    INJ: 1.2e7
    PROD: 1.0e7
  well_saturation:
    INJ: [0.80, 0.20, 0.0]
    PROD: [0.25, 0.75, 0.0]
  well_rate:
    INJ: 2.0e-5
    PROD: -2.0e-5
  # pressure-only probes (must NOT appear in saturation maps)
  observer_pressure:
    OBS_P1: 1.12e7
  # saturation-only probes (must NOT appear in pressure maps)
  observer_saturation:
    OBS_S1: [0.40, 0.60, 0.0]
  boundary_pressure:
    left: 1.2e7
    right: 1.0e7

priors:
  permeability_m2: 1.0e-13
  porosity: 0.2
  viscosity_pa_s: 1.0e-3
