# Sensor four-field demo case (axis-aligned bounds, two wells)

bounds:
  xmin: 0.0
  xmax: 100.0
  ymin: 0.0
  ymax: 80.0
  zmin: 0.0
  zmax: 30.0

grid:
  dx: 10.0
  dy: 10.0
  dz: 10.0

wells:
  - name: INJ
    x: 10.0
    y: 40.0
    z: 15.0
  - name: PROD
    x: 90.0
    y: 40.0
    z: 15.0

sensors:
  time: 0.0
  well_pressure:
    INJ: 1.2e7
    PROD: 1.0e7
  well_saturation:
    INJ: [0.80, 0.20, 0.0]
    PROD: [0.25, 0.75, 0.0]
  boundary_pressure:
    left: 1.2e7
    right: 1.0e7

priors:
  permeability_m2: 1.0e-13
  porosity: 0.2
  viscosity_pa_s: 1.0e-3
