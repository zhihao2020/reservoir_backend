# Multi-time sensor case (CSV-driven) + ES-MDA options

bounds:
  xmin: 0.0
  xmax: 100.0
  ymin: 0.0
  ymax: 80.0
  zmin: 0.0
  zmax: 30.0

grid:
  dx: 10.0
  dy: 10.0
  dz: 10.0

wells:
  - name: INJ
    x: 10.0
    y: 40.0
    z: 15.0
  - name: PROD
    x: 90.0
    y: 40.0
    z: 15.0

# Long-format CSVs (paths relative to repo root when running from there)
series:
  wells_csv: config/sensor_series_wells.csv
  boundary_csv: config/sensor_series_boundary.csv

priors:
  permeability_m2: 1.0e-13
  porosity: 0.2
  viscosity_pa_s: 1.0e-3

esmda:
  ne: 16
  n_assimilations: 3
  k_mean: 1.0e-13
  logk_std: 0.8
  corr_len_cells: 2.5
  obs_std_frac: 0.02
  localization_radius_m: 50.0
  ensemble_inflation: 1.02
  seed: 7
