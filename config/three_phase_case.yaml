case:
  case_id: three_phase_case
  output_dir: results
  mode: three_phase

grid:
  nx: 6
  ny: 4
  nz: 3
  dx: 1.0
  dy: 1.0
  dz: 1.0

rock:
  porosity: 0.25
  permeability: 1.0e-12

fluid:
  mu_w: 1.0e-3
  mu_o: 5.0e-3
  mu_g: 1.0e-5
  rho_w: 1000.0
  rho_o: 800.0
  rho_g: 100.0

three_phase:
  enabled: true
  model: incompressible_wog
  primary_variables:
    - Sw
    - Sg

relperm_three_phase:
  swi: 0.2
  sor: 0.2
  sgc: 0.05
  krw0: 0.3
  kro0: 0.8
  krg0: 0.6
  nw: 2.0
  "no": 2.0
  ng: 2.0

pressure:
  enabled: true
  boundary_type: left_right_dirichlet
  left_pressure: 10.0
  right_pressure: 9.0
  pressure_unit: MPa
  reference_pressure: 0.0

saturation:
  dt: 1.0
  steps: 1
  max_cfl: 1.0
  use_capillary: false
  use_gravity: false
  swi: 0.2
  sor: 0.2
  krw0: 1.0
  kro0: 1.0
  nw: 2.0
  no: 2.0
  injected_sw: 0.8

initial_saturation:
  sw: 0.25
  sg: 0.08

injection_composition:
  injected_sw: 0.75
  injected_sg: 0.05

capillary_pressure:
  enabled: false
  model: none

gravity:
  enabled: false
  g: 9.80665
  rho_w: 1000.0
  rho_o: 800.0
  depth_axis: z
  depth_positive: down

outputs:
  save_flux: true
  save_velocity: true
  save_reports: true
  save_three_phase_saturations: true
  save_three_phase_report: true
