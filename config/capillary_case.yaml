case:
  case_id: capillary_case
  output_dir: results
  mode: archie_only

grid:
  nx: 6
  ny: 5
  nz: 3
  dx: 1.0
  dy: 1.0
  dz: 1.0

rock:
  porosity: 0.2
  permeability_md: 100.0

fluid:
  mu_w: 1.0e-3
  mu_o: 5.0e-3

archie:
  a: 1.0
  m: 2.0
  n: 2.0
  rw: 0.25
  swi: 0.2
  sor: 0.2

electromagnetic:
  enabled: false
  model_type: linear
  coefficients: [0.05, 0.9]
  calibration_range: [0.0, 1.0]

acoustic:
  enabled: false
  model_type: linear
  coefficients: [1.1, -2.0e-4]
  calibration_range: [1500.0, 5000.0]

pressure:
  boundary_type: left_right_dirichlet
  left_pressure: 10.0
  right_pressure: 9.0
  pressure_unit: MPa
  reference_pressure: 0.0

saturation:
  dt: 1000.0
  steps: 3
  max_cfl: 1.0
  use_capillary: true
  use_gravity: false
  swi: 0.2
  sor: 0.2
  krw0: 1.0
  kro0: 1.0
  nw: 2.0
  no: 2.0
  injected_sw: 0.8

capillary_pressure:
  enabled: true
  model: brooks_corey
  entry_pressure_pa: 1000.0
  lambda_pc: 2.0
  p0_pa: 1000.0
  m: 0.5
  n: 2.0

gravity:
  enabled: false
  g: 9.80665
  rho_w: 1000.0
  rho_o: 800.0
  depth_axis: z
  depth_positive: down

fusion:
  signal_weights: [1.0, 1.0, 1.0]
  dynamic_alpha: 0.5

outputs:
  save_flux: true
  save_velocity: true
  save_reports: true
  save_capillary_pressure: true
  save_capillary_flux: true
  save_gravity_flux: false
  save_combined_report: false
