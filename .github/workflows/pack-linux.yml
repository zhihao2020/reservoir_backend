name: pack-linux

# Builds src/ into a single src.so on Ubuntu and publishes a zip.
# Manual: Actions → pack-linux → Run workflow
# Release: git tag v0.3.0 && git push --tags

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  src-so:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System compilers
        run: sudo apt-get update && sudo apt-get install -y build-essential python3-dev ccache

      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pyyaml
          python -m pip install -e ".[pack]"

      - name: Library version
        id: ver
        run: |
          python -c "from src.version import __version__; print('version=' + __version__)" >> "$GITHUB_OUTPUT"
          python -c "from src.version import __version__; print('reservoir-backend', __version__)"

      - name: Compile src.so
        run: python scripts/build_src_so.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reservoir-backend-${{ steps.ver.outputs.version }}-linux-so-cp312
          path: dist/linux/
          if-no-files-found: error

      - name: Attach zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/linux/reservoir-backend-*-linux-so.zip
          generate_release_notes: true
