name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Default suite
        run: python -m pytest -q --tb=line
        env:
          RESERVOIR_FLASH: fast
      - name: DPDP correctness
        run: python -m pytest -q --tb=line -m dpdp
        env:
          RESERVOIR_FLASH: fast
