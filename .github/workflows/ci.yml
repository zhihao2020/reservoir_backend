name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Import src and CLI
        run: |
          python -c "import src; print('reservoir-backend', src.__version__); assert src.run_pipeline"
          python -m src --version
      - name: Run tests
        run: python -m pytest
