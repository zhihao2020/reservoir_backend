# EXAMPLE C1–nC10 + immiscible water. Not a Jiyang GEM card.
geometry:
  size_m: [4.0, 3.0, 1.0]

grid:
  type: cartesian
  nx: 4
  ny: 3
  nz: 1

physics:
  model: compositional
  fluid: example
  has_water: true
  sw_init: 0.25
  temperature_k: 350.0
  z_init: [0.55, 0.45]
  z_inj: [0.95, 0.05]
  capillary: none
  gravity: false
  p_init: 1.2e7
  dt_init: 2.0
  dt_max: 10.0

rock:
  porosity: 0.20

ports:
  - name: INJ
    role: injector
    control: rate
    sw_inj: 1.0
    ijk: [[1, 1, 1], [1, 3, 1]]
  - name: PROD
    role: producer
    control: pressure
    ijk: [[4, 1, 1], [4, 3, 1]]

sensors:
  - {name: Pin_lo, kind: pressure, x: 1.0, y: 0.5, z: 0.5, sigma: 2.0e4}
  - {name: Sw_inj, kind: saturation, x: 0.5, y: 0.5, z: 0.5, sigma: 0.04}

inverse:
  parameterization: region
  region_axis: y
  n_regions: 2
  prior_mean: -28.2
  prior_std: 0.45
  max_iter: 8

experiment:
  history_end_s: 12
  controls:
    - {port: INJ, kind: rate, times: [0, 12], values: [0.05, 0.05]}
    - {port: PROD, kind: pressure, times: [0, 12], values: [1.1e7, 1.1e7]}
