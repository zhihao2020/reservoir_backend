# EXAMPLE monthly-scale 1 injector + 4 producers (closest HnP-style pattern).
# C1–nC10 published criticals only. Not a Jiyang GEM card.
# Real Jiyang .gem is still required for gate ③ nRMSE vs GEM well history.
# Missing fluid.gem_deck is a hard error (refuse invented Tc/Pc).
marker: EXAMPLE
pattern: hz_1inj4prod
notes: monthly-scale well-history scaffolding; not a Jiyang GEM card

geometry:
  size_m: [9.0, 9.0, 2.0]

grid:
  type: cartesian
  nx: 3
  ny: 3
  nz: 1

physics:
  model: compositional
  fluid: example
  has_water: true
  sw_init: 0.20
  temperature_k: 350.0
  z_init: [0.55, 0.45]
  z_inj: [0.95, 0.05]
  capillary: none
  gravity: false
  p_init: 1.2e7
  dt_init: 86400.0
  dt_max: 864000.0
  dt_min: 60.0
  max_steps: 40

rock:
  porosity: 0.20

ports:
  - name: INJ
    role: injector
    control: rate
    use_productivity: true
    rw_m: 0.10
    geofac: 0.198
    sw_inj: 0.0
    ijk: [2, 2, 1]
  - name: PROD1
    role: producer
    control: pressure
    use_productivity: true
    rw_m: 0.10
    geofac: 0.198
    ijk: [1, 1, 1]
  - name: PROD2
    role: producer
    control: pressure
    use_productivity: true
    rw_m: 0.10
    geofac: 0.198
    ijk: [3, 1, 1]
  - name: PROD3
    role: producer
    control: pressure
    use_productivity: true
    rw_m: 0.10
    geofac: 0.198
    ijk: [1, 3, 1]
  - name: PROD4
    role: producer
    control: pressure
    use_productivity: true
    rw_m: 0.10
    geofac: 0.198
    ijk: [3, 3, 1]

sensors:
  - {name: INJ_bhp, kind: bhp, x: 4.5, y: 4.5, z: 1.0, sigma: 5.0e4, port: INJ}
  - {name: PROD1_bhp, kind: bhp, x: 1.5, y: 1.5, z: 1.0, sigma: 5.0e4, port: PROD1}

inverse:
  parameterization: region
  region_axis: y
  n_regions: 2
  prior_mean: [-28.2, -28.2]
  prior_std: [1.0, 1.0]
  max_iter: 4
  algorithm: lm

experiment:
  history_end: 30
  history_end_unit: day
  controls:
    - {port: INJ, kind: rate, times: [0, 30], values: [0.02, 0.02], time_unit: day}
    - {port: PROD1, kind: pressure, times: [0, 30], values: [1.1e7, 1.1e7], time_unit: day}
    - {port: PROD2, kind: pressure, times: [0, 30], values: [1.1e7, 1.1e7], time_unit: day}
    - {port: PROD3, kind: pressure, times: [0, 30], values: [1.1e7, 1.1e7], time_unit: day}
    - {port: PROD4, kind: pressure, times: [0, 30], values: [1.1e7, 1.1e7], time_unit: day}
