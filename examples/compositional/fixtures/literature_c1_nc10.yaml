# LITERATURE EXAMPLE EOS card. Copied public tables already cited in-repo.
# NOT a Jiyang GEM card. NOT 济阳/现场. NOT for CMG-GEM product nRMSE.
#
# Sources (same numbers as examples/lab_v1/pvt.yaml and eos/example.py):
#   Tc/Pc/ω/Mw: Reid, Prausnitz, Poling, The Properties of Gases and Liquids,
#     5th ed., McGraw-Hill, 2001, Appendix A.
#   kij(C1–nC10) ≈ 0.049: Katz & Firoozabadi, JPT 1978; tabulated in
#     Whitson & Brulé, Phase Behavior, SPE Monograph 20, 2000.
#   Vc: OPM opm-tests compositional/1D_COMP.DATA METHANE/DECANE
#     (0.09863 / 0.60980 m3/kmol). The cubic itself does not use Vc.
# The other in-repo public table is OPM 1D_COMP CO2/C1/nC10
# (examples/compositional/fixtures/comp_c1c10co2.yaml). This file is the
# C1–nC10 binary used by the tiny literature run.
#
# True CMG-GEM compare still needs a user-exported .gem + well-history CSV.
# Missing fluid.gem_deck is a hard error (refuse invented Tc/Pc).
marker: literature
temperature_k: 350.0
names: [C1, nC10]
z_initial: [0.55, 0.45]
z_inj: [0.95, 0.05]
tc_k: [190.564, 617.70]
pc_pa: [4.5992e6, 2.103e6]
omega: [0.01142, 0.490]
mw_kg_mol: [0.0160425, 0.142282]
vcrit_m3_kmol: [0.09863, 0.60980]
kij:
  - [0.0, 0.049]
  - [0.049, 0.0]
mu_liquid: 3.0e-4
mu_vapor: 2.0e-5
# Match GEM *SGT linear 0–1 (no residual). CompSpec default Corey is example-only.
sorg: 0.0
sgr: 0.0
n_oil: 1.0
n_gas: 1.0
kro0: 1.0
krg0: 1.0
