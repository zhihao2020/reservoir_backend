# 300 mm 立方，两层 log K，6 mm 探头。
# 25 mm 网格，apply 大约一分钟。正式 10 mm / 30³ 见 examples/lab/lab_30cm.yaml。
#
# 自检（程序造假测点，证明会反演）：
#   reservoir apply examples/two_layer/case.yaml --demo --output results/examples/two_layer_demo
# 有探头 CSV 时改用 case_from_csv.yaml，不要加 --demo。
geometry:
  size_m: [0.3, 0.3, 0.3]

grid:
  type: cartesian
  spacing_m: 0.025

physics:
  model: two_phase_immiscible
  capillary: brooks_corey
  gravity: false
  pvt: incompressible
  sw_init: 0.20
  p_init: 1.5e5
  dt_init: 2.0
  dt_max: 20.0
  transport: implicit

rock:
  porosity: 0.20

ports:
  - name: INJ
    role: injector
    control: rate
    perforation: column
    x: 0.012
    y: 0.15
    sw_inj: 0.85
  - name: PROD
    role: producer
    control: pressure
    perforation: column
    x: 0.288
    y: 0.15

sensors_defaults:
  probe_diameter_m: 0.006

sensors:
  - {name: P_in_bot, kind: pressure, x: 0.08, y: 0.15, z: 0.06, sigma: 2.0e3}
  - {name: P_in_top, kind: pressure, x: 0.08, y: 0.15, z: 0.24, sigma: 2.0e3}
  - {name: P_out_bot, kind: pressure, x: 0.22, y: 0.15, z: 0.06, sigma: 2.0e3}
  - {name: P_out_top, kind: pressure, x: 0.22, y: 0.15, z: 0.24, sigma: 2.0e3}
  - {name: S_mid_bot, kind: saturation, x: 0.15, y: 0.15, z: 0.06, sigma: 0.04}
  - {name: S_mid_top, kind: saturation, x: 0.15, y: 0.15, z: 0.24, sigma: 0.04}

inverse:
  parameterization: region
  region_axis: z
  n_regions: 2
  prior_mean: -28.2
  prior_std: 1.0
  max_iter: 8

experiment:
  history_end_s: 500
  holdout_sensors: [P_out_top, S_mid_bot]
  controls:
    - {port: INJ, kind: rate, times: [0, 500, 700], values: [2.0e-6, 2.0e-6, 2.0e-6]}
    - {port: INJ, kind: composition, times: [0, 700], values: [0.85, 0.85]}
    - {port: PROD, kind: pressure, times: [0, 700], values: [1.0e5, 1.0e5]}
