# 与 case.yaml 相同，挂上测点 CSV。有实测时用这一份，不要加 --demo。
#   reservoir apply examples/channel/case_from_csv.yaml --output results/examples/channel
geometry:
  size_m: [0.3, 0.3, 0.3]

grid:
  type: cartesian
  spacing_m: 0.025

physics:
  model: two_phase_immiscible
  capillary: brooks_corey
  gravity: false
  compressibility: incompressible
  sw_init: 0.20
  p_init: 1.5e5
  dt_init: 2.0
  dt_max: 20.0
  transport: implicit

rock:
  porosity: 0.20

ports:
  - name: INJ
    role: injector
    control: rate
    perforation: column
    x: 0.012
    y: 0.15
    sw_inj: 0.85
  - name: PROD
    role: producer
    control: pressure
    perforation: column
    x: 0.288
    y: 0.15

sensors_defaults:
  probe_diameter_m: 0.006

sensors:
  - {name: Pch_in, kind: pressure, x: 0.08, y: 0.15, z: 0.15, sigma: 2.0e3}
  - {name: Pch_out, kind: pressure, x: 0.22, y: 0.15, z: 0.15, sigma: 2.0e3}
  - {name: Pmx_in, kind: pressure, x: 0.08, y: 0.05, z: 0.15, sigma: 2.0e3}
  - {name: Pmx_out, kind: pressure, x: 0.22, y: 0.05, z: 0.15, sigma: 2.0e3}
  - {name: Sch, kind: saturation, x: 0.15, y: 0.15, z: 0.15, sigma: 0.04}
  - {name: Smx, kind: saturation, x: 0.15, y: 0.05, z: 0.15, sigma: 0.04}

inverse:
  algorithm: esmda
  parameterization: contrast
  region_map: regions.npy
  ensemble_size: 16
  assimilation_steps: 4
  prior_mean: -28.2
  prior_std: 1.0
  seed: 7
  n_workers: 4
  reconstruct_members: 4

experiment:
  history_end_s: 500
  holdout_sensors: [Pmx_out, Sch]
  observations: observations.csv
  controls:
    - {port: INJ, kind: rate, times: [0, 500, 700], values: [2.0e-6, 2.0e-6, 2.0e-6]}
    - {port: INJ, kind: composition, times: [0, 700], values: [0.85, 0.85]}
    - {port: PROD, kind: pressure, times: [0, 700], values: [1.0e5, 1.0e5]}
