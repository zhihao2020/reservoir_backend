# 90-day smoke. Controls MUST end at history_end — simulate() uses last control time, not history_end_s.
# Depletion only. Matrix/frac region_map. Black-oil, not GEM.

geometry:
  size_m: [1260, 1260, 40]

grid:
  type: cartesian
  nx: 21
  ny: 21
  nz: 5

physics:
  model: black_oil
  fully_implicit: true
  capillary: brooks_corey
  gravity: false
  pvt: cmg_seawater
  sw_init: 0.25
  p_init: 2.068e7
  dt_init: 60
  dt_max: 2592000
  transport: implicit

rock:
  porosity: 0.06

ports:
  - name: INJ
    role: injector
    control: rate
    ijk: [[4,11,3], [5,11,3], [6,11,3], [7,11,3], [8,11,3], [9,11,3], [10,11,3], [11,11,3], [12,11,3], [13,11,3], [14,11,3], [15,11,3], [16,11,3], [17,11,3], [18,11,3]]
    sw_inj: 0.0
  - name: P1
    role: producer
    control: pressure
    ijk: [[4,3,3], [5,3,3], [6,3,3], [7,3,3], [8,3,3], [9,3,3], [10,3,3], [11,3,3], [12,3,3], [13,3,3], [14,3,3], [15,3,3], [16,3,3], [17,3,3], [18,3,3]]
  - name: P2
    role: producer
    control: pressure
    ijk: [[4,7,3], [5,7,3], [6,7,3], [7,7,3], [8,7,3], [9,7,3], [10,7,3], [11,7,3], [12,7,3], [13,7,3], [14,7,3], [15,7,3], [16,7,3], [17,7,3], [18,7,3]]
  - name: P3
    role: producer
    control: pressure
    ijk: [[4,15,3], [5,15,3], [6,15,3], [7,15,3], [8,15,3], [9,15,3], [10,15,3], [11,15,3], [12,15,3], [13,15,3], [14,15,3], [15,15,3], [16,15,3], [17,15,3], [18,15,3]]
  - name: P4
    role: producer
    control: pressure
    ijk: [[4,19,3], [5,19,3], [6,19,3], [7,19,3], [8,19,3], [9,19,3], [10,19,3], [11,19,3], [12,19,3], [13,19,3], [14,19,3], [15,19,3], [16,19,3], [17,19,3], [18,19,3]]

inverse:
  parameterization: contrast
  region_map: jiyang_frac_regions.npy
  max_iter: 5

experiment:
  history_end_s: 7776000
  controls:
    - port: INJ
      kind: rate
      times: [0, 7776000]
      values: [0, 0]
    - port: INJ
      kind: gas_composition
      times: [0, 7776000]
      values: [0, 0]
    - port: P1
      kind: pressure
      times: [0, 7776000]
      values: [1.93e7, 1.93e7]
    - port: P2
      kind: pressure
      times: [0, 7776000]
      values: [1.93e7, 1.93e7]
    - port: P3
      kind: pressure
      times: [0, 7776000]
      values: [1.93e7, 1.93e7]
    - port: P4
      kind: pressure
      times: [0, 7776000]
      values: [1.93e7, 1.93e7]
