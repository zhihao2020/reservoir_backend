# Jiyang-pattern 1-inj 4-prod compositional twin (EXAMPLE card).
# GEM ruler is validation/jiyang/cmg_co2_hnp — product does not call CMG.
# Fluid is published CO2+C1+nC10, not a Jiyang field .gem.
# Horizon matches the GEM smoke: 90 d depletion + 1 HnP cycle.
# INJ rate is molar (mol/s): 5e-5 m3/s / 0.023645 m3/mol (std gas).
geometry:
  size_m: [1260, 1260, 40]

grid:
  type: cartesian
  nx: 21
  ny: 21
  nz: 5

physics:
  model: compositional
  fluid: {file: ../compositional/fixtures/comp_c1c10co2.yaml}
  temperature_k: 350.0
  z_init: [0.01, 0.54, 0.45]
  z_inj: [1.0, 0.0, 0.0]
  has_water: true
  sw_init: 0.25
  capillary: none
  gravity: false
  p_init: 5.0e7
  dt_init: 100.0
  dt_max: 864000.0
  dt_min: 1.0
  max_steps: 800

rock:
  porosity: 0.06

ports:
  - name: INJ
    role: injector
    control: rate
    use_productivity: true
    rw_m: 0.10
    geofac: 0.37
    axis: I
    ijk: [[4,11,3], [5,11,3], [6,11,3], [7,11,3], [8,11,3], [9,11,3], [10,11,3], [11,11,3], [12,11,3], [13,11,3], [14,11,3], [15,11,3], [16,11,3], [17,11,3], [18,11,3]]
    sw_inj: 0.0
  - name: P1
    role: producer
    control: pressure
    use_productivity: true
    rw_m: 0.10
    geofac: 0.37
    axis: I
    ijk: [[4,3,3], [5,3,3], [6,3,3], [7,3,3], [8,3,3], [9,3,3], [10,3,3], [11,3,3], [12,3,3], [13,3,3], [14,3,3], [15,3,3], [16,3,3], [17,3,3], [18,3,3]]
  - name: P2
    role: producer
    control: pressure
    use_productivity: true
    rw_m: 0.10
    geofac: 0.37
    axis: I
    ijk: [[4,7,3], [5,7,3], [6,7,3], [7,7,3], [8,7,3], [9,7,3], [10,7,3], [11,7,3], [12,7,3], [13,7,3], [14,7,3], [15,7,3], [16,7,3], [17,7,3], [18,7,3]]
  - name: P3
    role: producer
    control: pressure
    use_productivity: true
    rw_m: 0.10
    geofac: 0.37
    axis: I
    ijk: [[4,15,3], [5,15,3], [6,15,3], [7,15,3], [8,15,3], [9,15,3], [10,15,3], [11,15,3], [12,15,3], [13,15,3], [14,15,3], [15,15,3], [16,15,3], [17,15,3], [18,15,3]]
  - name: P4
    role: producer
    control: pressure
    use_productivity: true
    rw_m: 0.10
    geofac: 0.37
    axis: I
    ijk: [[4,19,3], [5,19,3], [6,19,3], [7,19,3], [8,19,3], [9,19,3], [10,19,3], [11,19,3], [12,19,3], [13,19,3], [14,19,3], [15,19,3], [16,19,3], [17,19,3], [18,19,3]]

sensors:
  - {name: INJ_bhp, kind: bhp, x: 630.0, y: 630.0, z: 20.0, sigma: 1.0e5, port: INJ}
  - {name: P1_q_oil, kind: q_oil, x: 630.0, y: 150.0, z: 20.0, sigma: 1.0e-6, port: P1}
  - {name: P2_q_oil, kind: q_oil, x: 630.0, y: 390.0, z: 20.0, sigma: 1.0e-6, port: P2}
  - {name: P3_q_oil, kind: q_oil, x: 630.0, y: 870.0, z: 20.0, sigma: 1.0e-6, port: P3}
  - {name: P4_q_oil, kind: q_oil, x: 630.0, y: 1110.0, z: 20.0, sigma: 1.0e-6, port: P4}

inverse:
  parameterization: contrast
  region_map: jiyang_frac_regions.npy
  prior_mean: -35.24
  prior_std: 0.45
  max_iter: 5
  time_limit_s: 1800

experiment:
  history_end_s: 39398400
  holdout_sensors: [P4_q_oil]
  observations: fixtures/jiyang_co2_hnp_obs.csv
  controls:
    # t=91 d (7.8624e6) is still depletion in the GEM report; inject/soak BHP starts just after.
    - {port: INJ, kind: rate, times: [0, 7862400, 7862401, 10454400, 13132800, 13132801, 39398400], values: [0.0, 0.0, 0.002114, 0.0, 0.0, 0.0, 0.0]}
    - {port: INJ, kind: composition, times: [0, 39398400], values: [1.0, 1.0]}
    - {port: P1, kind: pressure, times: [0, 7862400, 7862401, 10454400, 13132800, 13132801, 39398400], values: [4.7e7, 4.7e7, 5.0e7, 5.0e7, 5.0e7, 4.7e7, 4.7e7]}
    - {port: P2, kind: pressure, times: [0, 7862400, 7862401, 10454400, 13132800, 13132801, 39398400], values: [4.7e7, 4.7e7, 5.0e7, 5.0e7, 5.0e7, 4.7e7, 4.7e7]}
    - {port: P3, kind: pressure, times: [0, 7862400, 7862401, 10454400, 13132800, 13132801, 39398400], values: [4.7e7, 4.7e7, 5.0e7, 5.0e7, 5.0e7, 4.7e7, 4.7e7]}
    - {port: P4, kind: pressure, times: [0, 7862400, 7862401, 10454400, 13132800, 13132801, 39398400], values: [4.7e7, 4.7e7, 5.0e7, 5.0e7, 5.0e7, 4.7e7, 4.7e7]}
