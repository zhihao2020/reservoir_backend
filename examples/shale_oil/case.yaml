# GEM shailoil 导出数据的重构 case（15×15×15，实验室尺度 30 cm 立方）
# 测点：底层 k=0/1/2 共 27 个（3×3×3），与井位对齐。
# 数据源：GEM Peng-Robinson 14 组分 CO2 页岩油模型（20 MPa，注纯 CO2）。
geometry:
  origin_m: [0.0, 0.0, 0.0]
  extent_m: [0.30, 0.30, 0.30]
  nx: 15
  ny: 15
  nz: 15

rock:
  phi0: 0.05
  k0_md: 0.03

probes:
  file: probes.csv
  observations: observations.csv

wells:
  file: wells.csv
  series: series.csv

inversion:
  model: black_oil_3phase
  relperm: [nw, no, ng, krw_end, kro_end, krg_end]
  # 本模型岩石均质（k 恒 0.03 mD）：跳过病态 k 反演、直接用常数 k0。
  k_homogeneous: true

forward:
  # none = 克里金插值。black_oil = 黑油。compositional = 14 组分摩尔前向。
  model: none

black_oil:
  mu_w_pa_s: 5.0e-4
  mu_o_pa_s: 2.0e-3
  mu_g_pa_s: 2.0e-5
  Swc: 0.0
  Sor: 0.0
  Sgc: 0.0
  ct_1pa: 1.2e-9
  # CO2 溶解气比输出（吞吐量指标 Rs=rs_slope·p≈187），输出 rs/co2 场。
  rs_slope: 9.84e-6
  # CO2 气体体积系数 Bg = 储层气体积 / 地面气体积。20 MPa 超临界 CO2 约 0.003。
  # 相劈分要求 1/Bg > Rs_max（≈140），即 Bg < 0.0071，否则自由气被剪成 0。
  bg: 0.003
  # 自由气重力头 rho_g = (rho_CO2 - rho_oil)*g，Pa/m；>0 表示 CO2 富相比油重、下沉到底层。
  # 更正(2026-09-28)：20 MPa、120℃ 超临界 CO2 实际密度 ~590 kg/m3(NIST，Z≈0.45)，
  # 比油 512.6 kg/m3 重 → rho_g 应为正(+759)。此前 -1421 用的 CO2 密度 369.8 是
  # PR EOS 未加 Peneloux 体积平移的低估值(本代码 PR EOS 给 Z=0.69→390 kg/m3)。
  # 底部羽流是 CO2 重→下沉 + 井压差共同驱动，重力项应是主驱动之一。
  rho_g: 759.0
  # 组分摩尔步气头：scalar = 上面的固定 rho_g；eos = 逐面 g*(ρ_g−ρ_l)（EOS 相密度）。
  gravity: scalar
  # 表格相渗（GEM deck *SGT / *SWT），替代 Corey 幂律 relperm。
  relperm_table:
    sgt:   # [Sg, Krg, Krog]
      - [0.00, 0.000, 1.000]
      - [0.05, 0.000, 1.000]
      - [0.20, 0.046, 0.618]
      - [0.40, 0.250, 0.250]
      - [0.55, 0.510, 0.082]
      - [0.75, 1.000, 0.000]
      - [1.00, 1.000, 0.000]
    swt:   # [Sw, Krw, Krow]
      - [0.0, 0.0, 1.0]
      - [1.0, 1.0, 0.0]

well:
  rw: 0.003
  skin: 0.0
  kv_kh: 0.2

similarity:
  field_length_m: 300.0
  field_width_m: 300.0
  field_height_m: 30.0
  field_flow_path_m: 150.0
  model_flow_path_m: 0.15
  volume_basis: reservoir
