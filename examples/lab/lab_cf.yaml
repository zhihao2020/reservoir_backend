# V1 lab apply path: scalar log(C_f/C_ref) + compositional DPDP + ES-MDA.
#   reservoir apply examples/lab/lab_cf.yaml --demo --output results/lab_cf
# Coarse mesh so ensemble forwards finish quickly. 30³ is the scale gate, not apply.
geometry:
  size_m: [0.30, 0.10, 0.10]

grid:
  type: cartesian
  nx: 3
  ny: 1
  nz: 1

physics:
  model: compositional_dpdp
  fluid: example
  temperature_k: 350.0
  z_init: [0.55, 0.45]
  z_inj: [0.95, 0.05]
  capillary: none
  gravity: false
  p_init: 1.2e7
  dt_init: 0.5
  dt_max: 2.0
  dt_min: 1.0e-6
  max_steps: 40
  shape_factor: 40.0
  phi_fracture: 0.02

rock:
  porosity: 0.08
  k_matrix_m2: 1.0e-15

ports:
  - name: INJ
    role: injector
    control: rate
    perforation: column
    x: 0.05
    y: 0.05
  - name: PROD
    role: producer
    control: pressure
    perforation: column
    x: 0.25
    y: 0.05

sensors_defaults:
  probe_diameter_m: 0.006

sensors:
  - {name: P_in, kind: pressure, x: 0.10, y: 0.05, z: 0.05, sigma: 2.0e4}
  - {name: P_mid, kind: pressure, x: 0.15, y: 0.05, z: 0.05, sigma: 2.0e4}
  - {name: P_out, kind: pressure, x: 0.20, y: 0.05, z: 0.05, sigma: 2.0e4}

inverse:
  parameterization: log_conductivity
  algorithm: auto
  ensemble_size: 6
  assimilation_steps: 2
  seed: 3
  prior_mean: 0.0
  prior_std: 0.8
  k_matrix_m2: 1.0e-15
  phi_fracture: 0.02

experiment:
  history_end_s: 6
  holdout_sensors: [P_out]
  controls:
    - {port: INJ, kind: rate, times: [0, 6], values: [2.0e-4, 2.0e-4]}
    - {port: INJ, kind: composition, times: [0, 6], values: [0.95, 0.95]}
    - {port: PROD, kind: pressure, times: [0, 6], values: [1.18e7, 1.18e7]}
