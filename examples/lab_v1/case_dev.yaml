# M1b fixture: 30 cm cube, 4×4×2. Same physics/face BCs as case.yaml.
# Not a coarsening of 30³. Tiny face twin (0.30×0.20×0.10, 4×2×1) is a
# separate diagnostic fixture (M1a), not this product-geometry case.
# Sensor contract: fracture-P (30 Pa, algorithmic identifiability only;
# matrix-P (2 kPa), Sg. M1c must restore instrument R=2 kPa.
geometry:
  size_m: [0.30, 0.30, 0.30]

grid:
  type: cartesian
  nx: 4
  ny: 4
  nz: 2

physics:
  model: compositional_dpdp
  fluid:
    file: pvt.yaml
  temperature_k: 350.0
  z_init: [0.55, 0.45]
  z_inj: [0.95, 0.05]
  capillary: none
  gravity: false
  p_init: 1.2e7
  dt_init: 0.5
  dt_max: 5.0
  dt_min: 1.0e-6
  max_steps: 400
  shape_factor: 40.0
  phi_fracture: 0.02
  k_matrix_m2: 1.0e-15

rock:
  porosity: 0.08
  k_matrix_m2: 1.0e-15

ports:
  - name: INJ
    role: injector
    control: rate
    perforation: face
    face: xmin
  - name: PROD
    role: producer
    control: pressure
    perforation: face
    face: xmax

sensors_defaults:
  probe_diameter_m: 0.006

sensors: sensors_dev.csv

inverse:
  parameterization: log_cf_tmf
  algorithm: esmda
  ensemble_size: 8
  assimilation_steps: 5
  seed: 3
  outlier_nsigma: 120.0
  cf_ref_m2: 1.0e-12
  tmf_multiplier_ref: 1.0
  prior_mean: [0.0, 0.0]
  prior_std: [0.8, 0.5]
  k_matrix_m2: 1.0e-15
  phi_fracture: 0.02

online:
  parameter_filter: parameter_enkf
  fast_predictor: frozen_lambda_pressure
  slow_interval_s: 2.0

experiment:
  history_end_s: 60
  controls: controls_dev.csv
