# Coarse twin of case.yaml for tests, generate_truth --dev, and CI.
# Same physics, face BCs, and sensor contract; 4×4×2 cells.
geometry:
  size_m: [0.30, 0.30, 0.30]

grid:
  type: cartesian
  nx: 4
  ny: 4
  nz: 2

physics:
  model: compositional_dpdp
  fluid:
    file: pvt.yaml
  temperature_k: 350.0
  z_init: [0.55, 0.45]
  z_inj: [0.95, 0.05]
  capillary: none
  gravity: false
  p_init: 1.2e7
  dt_init: 0.5
  dt_max: 2.0
  dt_min: 1.0e-6
  max_steps: 40
  shape_factor: 40.0
  phi_fracture: 0.02
  k_matrix_m2: 1.0e-15

rock:
  porosity: 0.08
  k_matrix_m2: 1.0e-15

ports:
  - name: INJ
    role: injector
    control: rate
    perforation: face
    face: xmin
  - name: PROD
    role: producer
    control: pressure
    perforation: face
    face: xmax

sensors_defaults:
  probe_diameter_m: 0.006

sensors: sensors_dev.csv

inverse:
  parameterization: log_conductivity
  algorithm: esmda
  ensemble_size: 8
  assimilation_steps: 2
  seed: 3
  prior_mean: 0.0
  prior_std: 0.8
  k_matrix_m2: 1.0e-15
  phi_fracture: 0.02

online:
  parameter_filter: parameter_enkf
  fast_predictor: frozen_lambda_pressure
  slow_interval_s: 2.0

experiment:
  history_end_s: 6
  controls: controls.csv
