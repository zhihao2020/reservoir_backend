# V1 product case: 30 cm compositional DPDP FIM.
# Invert θ = (log C_f, log T_mf) from a history window, then freeze θ and
# forward the full well-control schedule. k_m, φ_m, φ_f, PVT are fixed.
# Do not run 30³ ES-MDA in CI. Use case_dev.yaml / scripts with --dev.
#
# Config contract: case.yaml + pvt.yaml + wells.yaml + controls.csv + observations.
geometry:
  size_m: [0.30, 0.30, 0.30]

grid:
  type: cartesian
  dx: 0.01
  dy: 0.01
  dz: 0.01

physics:
  model: compositional_dpdp
  fluid:
    file: pvt.yaml
  temperature_k: 350.0
  z_init: [0.55, 0.45]
  z_inj: [0.95, 0.05]
  capillary: none
  gravity: false
  p_init: 1.2e7
  dt_init: 0.5
  dt_max: 5.0
  dt_min: 1.0e-6
  max_steps: 400
  shape_factor: 40.0
  phi_fracture: 0.02
  k_matrix_m2: 1.0e-15

rock:
  porosity: 0.08
  k_matrix_m2: 1.0e-15

# User rock stiffness. DPDP rejects enabled: true; single-porosity reads E_GPa.
geomech:
  enabled: false
  nocouperm: true
  boundary: unconstrained
  biot: 1.0
  E_GPa: 20.0
  nu: 0.22

wells: wells.yaml

sensors_defaults:
  probe_diameter_m: 0.006

sensors: sensors.csv

inverse:
  parameterization: log_cf_tmf
  algorithm: esmda
  ensemble_size: 12
  assimilation_steps: 4
  seed: 3
  cf_ref_m2: 1.0e-12
  tmf_multiplier_ref: 1.0
  prior_mean: [0.0, 0.0]
  prior_std: [0.8, 0.5]
  k_matrix_m2: 1.0e-15
  phi_fracture: 0.02

online:
  parameter_filter: parameter_enkf
  fast_predictor: frozen_lambda_pressure
  slow_interval_s: 60.0

experiment:
  history_end_s: 60
  controls: controls.csv
